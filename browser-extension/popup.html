<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>保存到溯源</title>
  <style>
    :root { color-scheme: light; --ink: #1c3029; --muted: #64736b; --line: #dce5de; --green: #174d3d; --pale: #eaf4ed; --paper: #fbfcf9; }
    * { box-sizing: border-box; }
    body { width: 386px; max-height: 600px; margin: 0; overflow-y: auto; color: var(--ink); background: var(--paper); font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid #247e60; outline-offset: 2px; }
    .top { display: flex; align-items: center; justify-content: space-between; padding: 15px 18px; border-bottom: 1px solid var(--line); background: #fff; }
    .brand { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 760; letter-spacing: .04em; }
    .mark { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; color: #fff; background: var(--green); font: 700 16px/1 Georgia, serif; }
    .top a { color: var(--muted); text-decoration: none; font-size: 12px; }
    main { padding: 18px; }
    .eyebrow { margin: 0 0 7px; color: #39705a; font-size: 10px; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; }
    h1 { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; margin: 0 0 10px; font: 650 20px/1.34 "Segoe UI", "Microsoft YaHei", sans-serif; overflow-wrap: anywhere; }
    .meta { display: flex; flex-wrap: wrap; gap: 4px 9px; color: var(--muted); font-size: 11px; }
    .meta span + span::before { content: "·"; margin-right: 9px; color: #a0ada4; }
    .capture { margin-top: 19px; padding: 13px 14px; border: 1px solid #cde2d3; border-radius: 9px; background: var(--pale); }
    .capture-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .capture-head strong { font-size: 12px; }
    .capture-head span { font-variant-numeric: tabular-nums; color: #2d634c; font-weight: 700; white-space: nowrap; }
    .capture p { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; margin: 8px 0 0; color: #4e6256; font-size: 12px; line-height: 1.55; overflow-wrap: anywhere; }
    .capture.warn { border-color: #e9d7b2; background: #fff8eb; }
    .capture.warn .capture-head span { color: #9b651d; }
    .primary { display: block; width: 100%; margin-top: 15px; padding: 11px 14px; border: 0; border-radius: 8px; background: var(--green); color: #fff; font-weight: 700; font-size: 13px; }
    .primary:hover { background: #0d3d30; }
    .primary:disabled { background: #a8b8ac; cursor: default; }
    .paper-panel { margin-top: 16px; padding: 15px; border: 1px solid #c8d9d0; border-radius: 9px; background: #f1f6f2; }
    .paper-panel[hidden] { display: none; }
    .paper-panel strong { display: block; font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; }
    .paper-panel p { margin: 7px 0 0; color: var(--muted); font-size: 11px; }
    .paper-panel .primary { margin-top: 11px; }
    .paper-doi { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-top: 8px; font-size: 11px; }
    .paper-doi code { overflow-wrap: anywhere; }
    .paper-doi a { color: #17533f; font-weight: 700; }
    .paper-panel .vision-option { display: flex; gap: 6px; align-items: flex-start; margin-top: 10px; font-size: 11px; color: var(--muted); }
    .paper-panel .vision-option input { margin-top: 3px; }
    .paper-panel .file-option { display: block; margin-top: 13px; padding-top: 10px; border-top: 1px solid #d5e3d9; color: var(--ink); font-size: 11px; font-weight: 650; }
    .paper-panel .file-option input { display: block; width: 100%; margin-top: 6px; font-size: 11px; }
    .hint { margin: 10px 0 0; color: var(--muted); font-size: 11px; }
    .status { min-height: 18px; margin: 11px 0 0; color: #246347; font-size: 12px; }
    .status.error { color: #a33328; }
    details { margin-top: 15px; border-top: 1px solid var(--line); }
    summary { padding: 13px 1px 4px; color: #365648; font-weight: 650; cursor: pointer; list-style: none; }
    summary::after { content: "⌄"; float: right; color: #698b79; }
    details[open] summary::after { content: "⌃"; }
    .fields { display: grid; gap: 9px; padding: 10px 0 2px; }
    .fields label { display: block; color: #53665a; font-size: 11px; font-weight: 650; }
    .fields input, .fields select, .fields textarea { display: block; width: 100%; margin-top: 4px; padding: 8px 9px; border: 1px solid #ccd8cf; border-radius: 6px; background: #fff; color: var(--ink); font-size: 12px; }
    .fields textarea { min-height: 135px; resize: vertical; line-height: 1.55; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .small-action { justify-self: start; padding: 6px 0; border: 0; background: transparent; color: #236a4d; font-size: 11px; font-weight: 650; }
    .setup-note { margin: 7px 0 0; color: var(--muted); font-size: 11px; }
    .connection-row { display: flex; align-items: center; gap: 10px; }
    .test-button { flex: none; padding: 8px 11px; border: 1px solid #a8c8b3; border-radius: 6px; background: #eaf4ed; color: #174d3b; font-size: 12px; font-weight: 700; }
    .test-button:disabled { opacity: .6; cursor: wait; }
    .connection-result { color: #296d4f; font-size: 11px; }
    .connection-result.error { color: #a33328; }
    .footer { padding: 11px 18px; border-top: 1px solid var(--line); color: #819087; background: #fff; font-size: 10px; }
  </style>
</head>
<body>
  <header class="top"><div class="brand"><span class="mark" aria-hidden="true">溯</span><span>溯源 Clipper</span></div><a id="open" href="http://127.0.0.1:8000" target="_blank" rel="noopener">打开溯源 ↗</a></header>
  <main>
    <p class="eyebrow">当前页面</p>
    <h1 id="preview-title">正在读取文章…</h1>
    <div class="meta" id="preview-meta"></div>
    <section class="paper-panel" id="paper-panel"><p class="eyebrow">论文 PDF 入库</p><strong id="paper-title">选择 PDF 文件入库</strong><div class="paper-doi" id="paper-doi" hidden><span>DOI</span><code id="paper-doi-text"></code><a id="paper-scihub" href="#">查找可用 Sci-Hub ↗</a></div><p id="paper-note">先从论文网站下载 PDF，再在下方选择文件。</p><label class="vision-option"><input id="paper-vision" type="checkbox">本地 OCR 质量不足时，使用分析 API 识别该页图片</label><label class="file-option">选择本机 PDF<input id="paper-file" type="file" accept=".pdf,application/pdf"></label><button type="button" class="primary" id="upload-paper" disabled>识别并入库 ↗</button></section>
    <div class="capture" id="capture"><div class="capture-head"><strong id="capture-label">正在提取正文</strong><span id="length">—</span></div><p id="preview-text">打开报道后点击扩展，即可预览当前页面可见的内容。</p></div>
    <button type="button" class="primary" id="import" disabled>保存到溯源</button>
    <p class="hint" id="hint">保存前请确认浏览器已显示你想使用的完整正文。</p>
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <details id="review"><summary>检查与修改内容</summary><div class="fields">
      <label>标题<input id="title" maxlength="300"></label>
      <label>文章链接<input id="url" type="url" spellcheck="false"></label>
      <div class="two"><label>媒体<input id="source" maxlength="120"></label><label>发布日期<input id="published_at" type="date"></label></div>
      <label>语种<select id="language"><option value="en">英语</option><option value="zh">中文</option><option value="es">西语</option><option value="de">德语</option><option value="fr">法语</option><option value="ja">日语</option><option value="ko">韩语</option><option value="ru">俄语</option><option value="ar">阿拉伯语</option><option value="pt">葡语</option><option value="vi">越语</option><option value="th">泰语</option></select></label>
      <label>正文<textarea id="content" placeholder="页面未提取完整时，可粘贴当前可阅读的正文。"></textarea></label>
      <button type="button" id="read" class="small-action">重新读取当前页面</button>
    </div></details>
    <details id="settings"><summary>连接设置</summary><div class="fields">
      <p class="setup-note">首次使用时，在溯源网页的“浏览器导入”区域复制配对码，粘贴一次即可。</p>
      <label>配对码<input id="token" type="password" placeholder="粘贴溯源网页上的配对码" spellcheck="false"></label>
      <label>本地服务地址<input id="server" value="http://127.0.0.1:8000" spellcheck="false"></label>
      <div class="connection-row"><button type="button" id="test-connection" class="test-button">测试连接</button><span id="connection-result" class="connection-result" role="status" aria-live="polite"></span></div>
    </div></details>
  </main>
  <footer class="footer">只导入你选择的本机 PDF；DOI 外部链接不会自动入库。</footer>
  <script src="popup.js"></script>
</body>
</html>
